# /etc/nginx/sites-available/4lancers  — static site + API reverse proxy
server {
    listen 80;
    server_name 4lancers.com www.4lancers.com;
    return 301 https://www.4lancers.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.4lancers.com;

    # certbot --nginx -d 4lancers.com -d www.4lancers.com
    ssl_certificate     /etc/letsencrypt/live/4lancers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4lancers.com/privkey.pem;

    root /var/www/4lancers/client/dist/client;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed build assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → Express
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    # Pre-rendered pages: /about -> /about/index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
